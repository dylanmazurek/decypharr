name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. 1.2.0 or v1.2.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY_GHCR: ghcr.io/dylanmazurek/decypharr
  LDFLAGS_PKG: github.com/dylanmazurek/decypharr/pkg/version
  GO_VERSION: 1.27.1
  RCLONE_VERSION: 1.69.3

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Determine version and tag
        id: meta
        run: |
          git fetch --tags --force

          OVERRIDE_VER="${{ inputs.version }}"
          if [ -n "$OVERRIDE_VER" ]; then
            TAG="v${OVERRIDE_VER#v}"
            VERSION="${TAG#v}"
          else
            LATEST_TAG=$(git tag --merged HEAD --list 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v1.0.0"
              VERSION="1.0.0"
            else
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
              TAG="v${VERSION}"
            fi
          fi

          echo "Determined release: tag=${TAG}, version=${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=stable" >> "$GITHUB_OUTPUT"

  # Build Linux amd64 binary (CGO required for FUSE + rapidyenc)
  build-linux:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install libfuse-dev
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          CC: gcc
          CXX: g++
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p dist
          go build -trimpath -tags disable_libutp \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr

      - name: Package
        run: |
          tar czf "dist/decypharr_linux_x86_64.tar.gz" -C dist decypharr

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/decypharr_linux_x86_64.tar.gz

  # Build and push Linux amd64 Docker image
  docker:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            CHANNEL=${{ needs.prepare.outputs.channel }}
            RCLONE_VERSION=${{ env.RCLONE_VERSION }}
          tags: |
            ${{ env.REGISTRY_GHCR }}:${{ needs.prepare.outputs.tag }}
            ${{ env.REGISTRY_GHCR }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub release with amd64 binary
  release:
    runs-on: ubuntu-latest
    needs: [ prepare, build-linux, docker ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist

      - name: Create GitHub Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET_COMMIT" \
              --title "$TAG" \
              --generate-notes
          fi
